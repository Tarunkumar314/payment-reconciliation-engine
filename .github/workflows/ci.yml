name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start Infrastructure (Postgres, Redis, Kafka)
        run: |
          docker compose up -d postgres redis kafka

      - name: Wait for Infrastructure Health
        run: |
          echo "Waiting for services to report healthy..."
          for i in {1..30}; do
            POSTGRES_HEALTH=$(docker inspect --format='{{json .State.Health.Status}}' reconcile_postgres 2>/dev/null || echo '"starting"')
            REDIS_HEALTH=$(docker inspect --format='{{json .State.Health.Status}}' reconcile_redis 2>/dev/null || echo '"starting"')
            KAFKA_HEALTH=$(docker inspect --format='{{json .State.Health.Status}}' reconcile_kafka 2>/dev/null || echo '"starting"')
            
            if [ "$POSTGRES_HEALTH" == '"healthy"' ] && [ "$REDIS_HEALTH" == '"healthy"' ] && [ "$KAFKA_HEALTH" == '"healthy"' ]; then
              echo "All services healthy!"
              break
            fi
            echo "Waiting... Postgres: $POSTGRES_HEALTH, Redis: $REDIS_HEALTH, Kafka: $KAFKA_HEALTH"
            sleep 2
          done

      - name: Run Pytest Suite
        env:
          DATABASE_URL: postgresql+asyncpg://reconcile_user:reconcile_pass@localhost:5432/reconcile_db
          TEST_DATABASE_URL: postgresql+asyncpg://reconcile_user:reconcile_pass@localhost:5432/reconcile_test_db
          REDIS_URL: redis://localhost:6379/0
          TEST_REDIS_URL: redis://localhost:6379/1
          KAFKA_BOOTSTRAP_SERVERS: localhost:9092
          KAFKA_SETTLEMENT_TOPIC: settlement-events
          KAFKA_DLQ_TOPIC: settlement-events-dlq
          MOCK_BANK_URL: http://localhost:8000
        run: |
          python -m pytest -v
