name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Create .env file
        run: cp .env.example .env

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start Infrastructure (Postgres, Redis, Kafka)
        run: |
          docker compose up -d postgres redis kafka

      - name: Wait for Infrastructure Readiness
        run: |
          echo "Waiting for PostgreSQL..."
          timeout 60s bash -c 'until docker compose exec -T postgres pg_isready -U reconcile_user -d reconcile_db; do sleep 2; done'
          
          echo "Ensuring reconcile_test_db exists..."
          docker compose exec -T postgres psql -U reconcile_user -d reconcile_db -tc "SELECT 1 FROM pg_database WHERE datname = 'reconcile_test_db'" | grep -q 1 || \
            docker compose exec -T postgres psql -U reconcile_user -d reconcile_db -c "CREATE DATABASE reconcile_test_db OWNER reconcile_user;"

          echo "Waiting for Redis..."
          timeout 60s bash -c 'until docker compose exec -T redis redis-cli ping | grep PONG; do sleep 1; done'

          echo "Waiting for Kafka..."
          timeout 60s bash -c 'until docker compose exec -T kafka /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1; do sleep 2; done'
          echo "All infrastructure services are ready!"

      - name: Run Pytest Suite
        env:
          PYTHONPATH: .
          DATABASE_URL: postgresql+asyncpg://reconcile_user:reconcile_pass@localhost:5432/reconcile_db
          TEST_DATABASE_URL: postgresql+asyncpg://reconcile_user:reconcile_pass@localhost:5432/reconcile_test_db
          REDIS_URL: redis://localhost:6379/0
          TEST_REDIS_URL: redis://localhost:6379/1
          KAFKA_BOOTSTRAP_SERVERS: localhost:9092
          KAFKA_SETTLEMENT_TOPIC: settlement-events
          KAFKA_DLQ_TOPIC: settlement-events-dlq
          MOCK_BANK_URL: http://localhost:8000
        run: |
          pytest -v
